name: Deploy to GKE

on:
  push:
    branches: [ "main", "dev" ]

env:
  USE_GKE_GCLOUD_AUTH_PLUGIN: True

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: '>= 390.0.0'
        install_components: 'gke-gcloud-auth-plugin'

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY_PROD || secrets.GCP_SA_KEY_DEV }}

    - name: Configure Docker
      run: |
        REGION=${{ github.ref == 'refs/heads/main' && secrets.GKE_REGION_PROD || secrets.GKE_REGION_DEV }}
        gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

    - name: Set up GKE credentials
      run: |
        PROJECT=${{ github.ref == 'refs/heads/main' && secrets.GCP_PROJECT_PROD || secrets.GCP_PROJECT_DEV }}
        REGION=${{ github.ref == 'refs/heads/main' && secrets.GKE_REGION_PROD || secrets.GKE_REGION_DEV }}
        CLUSTER=${{ github.ref == 'refs/heads/main' && secrets.GKE_CLUSTER_PROD || secrets.GKE_CLUSTER_DEV }}

        gcloud container clusters get-credentials $CLUSTER \
          --region $REGION \
          --project $PROJECT

    - name: Build and push image
      run: |
        PROJECT=${{ github.ref == 'refs/heads/main' && secrets.GCP_PROJECT_PROD || secrets.GCP_PROJECT_DEV }}
        REGION=${{ github.ref == 'refs/heads/main' && secrets.GKE_REGION_PROD || secrets.GKE_REGION_DEV }}
        REPO=my-repository

        GIT_SHA=$(git rev-parse --short HEAD)
        IMAGE=$REGION-docker.pkg.dev/$PROJECT/$REPO/webserver:$GIT_SHA

        echo "Building $IMAGE"
        docker build -t $IMAGE .
        docker push $IMAGE

        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

    - name: Set up Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Deploy with Helm
      run: |
        helm upgrade --install webserver ./charts/webserver \
          -f ./charts/webserver/values.yaml \
          --set image.tag=${GITHUB_SHA::7}
          